<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圣旨七日 · 快乐小游戏</title><link rel="stylesheet" href="/shared/theme.css"><link rel="stylesheet" href="/shared/game.css"><link rel="stylesheet" href="/edict-seven/edict.css"></head><body>
  <script type="module" src="/shared/game-runtime.js"></script><main class="game game-history edict-game"><header class="game-header"><div><h1>圣旨七日</h1><p>七天之内，办妥圣旨，守住一城</p></div><div><button id="rules" type="button">规则</button><a class="back" href="/history/">返回历史</a></div></header><section class="edict-layout"><div class="edict-main"><div id="decree" class="decree"></div><div class="action-head"><span>本日可行动 <b id="actions"></b> 次</span><span id="day"></span></div><div id="cards" class="cards"></div><div id="log" class="log"></div></div><aside class="edict-side"><div id="stats" class="edict-stats"></div><button id="settle" class="reset-btn" type="button" disabled>呈报圣旨</button><div class="hint">每一天只能做三件事。资源与人心并不总能兼得，办妥当前圣旨后才进入下一日。</div></aside></section><div id="rules-modal" class="modal hidden"><div class="modal-backdrop" data-close></div><div class="modal-card edict-modal"><button id="close" type="button">×</button><h2 class="modal-title">游戏规则</h2><ol><li>连续七天，每天有三次行动机会，从四张行动卡中选择。</li><li>行动会改变银两、粮食、民心、治安、士族、名望和情报。</li><li>三次行动后呈报当日圣旨。满足圣旨要求会获得奖励，否则承受后果。</li><li>民心、治安或名望降到零即失守。第七日结束按全局政绩结算。</li></ol></div></div><div id="end-modal" class="modal hidden"><div class="modal-backdrop"></div><div class="modal-card"><p>七日结算</p><h2 id="end-title" class="modal-title"></h2><p id="end-text" class="modal-text"></p><button id="restart" class="reset-btn" type="button">再来一局</button></div></div></main><script type="module" src="/edict-seven/edict.js"></script></body></html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>规则方块 · 快乐小游戏</title><link rel="stylesheet" href="/shared/theme.css"><link rel="stylesheet" href="/shared/game.css"><link rel="stylesheet" href="/rule-blocks/rule-blocks.css"></head><body>
  <script type="module" src="/shared/game-runtime.js"></script><main class="game game-puzzle rule-game"><header class="game-header"><div><h1>规则方块</h1><p class="rule-subtitle">推动文字，改写世界的运行规则</p></div><div class="rule-head-actions"><button id="rules-btn" type="button">规则</button><a class="back" href="/puzzle/">返回益智</a></div></header><section class="rule-layout"><div class="rule-board-wrap"><div class="rule-board-top"><span id="level-title"></span><span id="move-count"></span></div><div id="board" class="rule-board" aria-label="规则方块棋盘"></div><div class="rule-pad"><button data-dir="up" aria-label="向上移动">↑</button><button data-dir="left" aria-label="向左移动">←</button><button data-dir="down" aria-label="向下移动">↓</button><button data-dir="right" aria-label="向右移动">→</button></div></div><aside class="rule-side"><div><div class="label">选择关卡</div><div id="levels" class="rule-levels"></div></div><div class="rule-actions"><button id="undo-btn" class="diff-btn" type="button">撤销</button><button id="reset-btn" class="reset-btn" type="button">重置</button></div><div id="active-rules" class="active-rules"></div><div id="status" class="rule-status">用方向键、WASD 或下方按键移动。</div></aside></section><div id="rules-modal" class="modal hidden" role="dialog"><div class="modal-backdrop" data-close></div><div class="modal-card rule-modal"><div class="rule-modal-top"><h2 class="modal-title">游戏规则</h2><button id="close-rules" type="button">×</button></div><ol><li>棋盘上的文字不是说明，而是规则本身。例如 <b>墙 是 停</b> 代表墙会阻挡移动。</li><li>文字方块默认都可以推动。推开“停”“胜”“你”等词，原来的规则会立即失效。</li><li><b>我 是 你</b>：控制“我”；<b>旗 是 胜</b>：碰到旗子即可过关；<b>水 是 灭</b>：碰到水会消失。</li><li>目标是让任意“你”与任意“胜”重叠。每次移动后都看看右侧当前生效的规则。</li></ol></div></div><div id="win-modal" class="modal hidden" role="dialog"><div class="modal-backdrop"></div><div class="modal-card"><h2 class="modal-title">规则成立</h2><p id="win-text" class="modal-text"></p><div class="modal-actions"><button id="next-btn" class="reset-btn" type="button">下一关</button></div></div></div></main><script type="module" src="/rule-blocks/rule-blocks.js"></script></body></html>

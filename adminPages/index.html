<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>用户管理 · 快乐小游戏</title>
  <link rel="stylesheet" href="/shared/theme.css">
  <style>
    .admin-page { max-width: 1120px; margin: 0 auto; padding: 30px 24px 48px; }
    .admin-bar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 17px; border-bottom: 1px solid var(--border); }
    .admin-brand { color: var(--ink); font-family: var(--font-title); font-size: 25px; text-decoration: none; }
    .admin-brand span { color: var(--accent-red); }
    .admin-user { color: var(--muted); font-size: 13px; }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 42px 0 20px; }
    h1 { margin: 0 0 7px; font-size: 38px; line-height: 1.1; }
    .intro p { margin: 0; color: var(--muted); font-size: 14px; }
    .admin-stats { display: flex; gap: 22px; }
    .stat { min-width: 92px; padding-left: 13px; border-left: 3px solid var(--accent-teal); }
    .stat:nth-child(2) { border-color: var(--accent-gold); }
    .stat b { display: block; font-size: 24px; line-height: 1; }
    .stat span { color: var(--muted); font-size: 12px; }
    .table-shell { overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-soft); }
    .table-tools { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
    .table-tools span { color: var(--muted); font-size: 13px; }
    button { min-height: 44px; padding: 7px 11px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); color: var(--ink); cursor: pointer; font: inherit; font-size: 13px; }
    button:hover { border-color: var(--accent-teal); color: var(--accent-teal); }
    button.delete { border-color: color-mix(in srgb, var(--danger) 38%, var(--border)); color: var(--danger); }
    button.delete:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
    button:disabled { opacity: .55; cursor: wait; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { color: var(--muted); background: var(--surface-muted); font-size: 12px; font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    .username { font-weight: 650; }
    .administrator { display: inline-block; margin-left: 7px; padding: 2px 6px; border-radius: 3px; background: color-mix(in srgb, var(--accent-gold) 17%, var(--surface)); color: #8c6512; font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) { .administrator { color: var(--accent-gold); } }
    .status { color: var(--success); font-size: 12px; }
    .empty { padding: 46px 16px; color: var(--muted); text-align: center; }
    .notice { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    .notice.error { color: var(--danger); }
    .game-analytics { margin-top: 28px; }
    .analytics-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 12px; }
    .analytics-head h2 { margin: 0; font-size: 24px; }
    .analytics-head p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .analytics-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
    .analytics-card { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .analytics-card b { display: block; color: var(--accent-teal-text); font-size: 22px; }
    .analytics-card span { color: var(--muted); font-size: 12px; }
    .analytics-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
    .analytics-game { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-muted); }
    .analytics-game strong { display: block; font-size: 14px; }
    .analytics-game small { color: var(--muted); font-size: 11px; }
    .analytics-game b { color: var(--accent-gold-text); font-size: 15px; white-space: nowrap; }
    .table-scroll-note { display: none; color: var(--muted); font-size: 12px; }
    th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); box-shadow: 5px 0 8px rgba(31, 44, 41, 0.06); }
    th:first-child { background: var(--surface-muted); }
    @media (max-width: 640px) {
      .admin-page { padding: 18px 14px 32px; }
      .admin-bar { align-items: flex-start; }
      .admin-user { display: none; }
      .intro { display: block; margin: 28px 0 18px; }
      h1 { font-size: 32px; }
      .admin-stats { margin-top: 22px; }
      .table-shell { overflow-x: auto; }
      table { min-width: 600px; }
      .table-scroll-note { display: block; padding: 8px 16px 10px; border-bottom: 1px solid var(--border); }
      th:first-child, td:first-child { box-shadow: 5px 0 10px rgba(31, 44, 41, 0.1); }
      .analytics-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .analytics-head { display: block; }
    }
  </style>
</head>
<body>
  <main class="admin-page">
    <header class="admin-bar">
      <a class="admin-brand" href="/"><span>快乐小游戏</span> / 管理台</a>
      <div class="admin-user">管理员：zhoujun</div>
    </header>
    <section class="intro">
      <div><h1>用户管理</h1><p>查看账户注册与会话状态，维护站点用户。</p></div>
      <div class="admin-stats"><div class="stat"><b id="user-count">-</b><span>注册用户</span></div><div class="stat"><b id="active-count">-</b><span>当前有效会话</span></div></div>
    </section>
    <section class="table-shell" aria-label="用户列表" role="region" tabindex="0">
      <div class="table-tools"><span id="table-status">正在加载用户信息</span><button type="button" id="refresh">刷新</button></div>
      <div class="table-scroll-note" aria-hidden="true">左右滑动查看完整表格 →</div>
      <table>
        <caption class="sr-only">注册用户及会话状态</caption>
        <thead><tr><th>用户名</th><th>注册时间</th><th>有效会话</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="user-list"></tbody>
      </table>
    </section>
    <p class="notice" id="notice" role="status"></p>
    <section class="game-analytics" aria-labelledby="analytics-title">
      <div class="analytics-head"><div><h2 id="analytics-title">游戏数据</h2><p>仅统计已进入数据链路的对局，游客不会显示个人身份。</p></div></div>
      <div class="analytics-summary" id="analytics-summary" aria-live="polite"></div>
      <div class="analytics-list" id="analytics-games"></div>
    </section>
  </main>
  <script type="module">
    const list = document.getElementById('user-list');
    const status = document.getElementById('table-status');
    const notice = document.getElementById('notice');
    const fmt = time => time ? new Intl.DateTimeFormat('zh-CN', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(time)) : '无有效会话';
    const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    async function loadUsers() {
      status.textContent = '正在加载用户信息'; notice.textContent = ''; notice.className = 'notice';
      try {
        const response = await fetch('/api/admin/users');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '加载失败');
        const users = data.users || [];
        document.getElementById('user-count').textContent = users.length;
        document.getElementById('active-count').textContent = users.reduce((sum, user) => sum + Number(user.session_count || 0), 0);
        status.textContent = `共 ${users.length} 位用户`;
        list.innerHTML = users.length ? users.map(user => `<tr>
          <td class="username">${escapeHtml(user.username)}${user.username === 'zhoujun' ? '<span class="administrator">管理员</span>' : ''}</td>
          <td>${fmt(user.created_at)}</td><td>${user.session_count || 0}</td>
          <td>${user.active_until ? '<span class="status">会话有效</span>' : '未登录'}</td>
          <td>${user.username === 'zhoujun' ? '受保护' : `<button class="delete" type="button" data-user="${escapeHtml(user.username)}">删除用户</button>`}</td>
        </tr>`).join('') : '<tr><td colspan="5" class="empty">还没有注册用户</td></tr>';
      } catch (error) {
        status.textContent = '无法加载'; notice.textContent = error.message; notice.className = 'notice error';
      }
    }
    document.getElementById('refresh').addEventListener('click', loadUsers);
    list.addEventListener('click', async event => {
      const button = event.target.closest('[data-user]');
      if (!button) return;
      const username = button.dataset.user;
      if (!confirm(`确定删除用户「${username}」及其所有登录会话吗？`)) return;
      button.disabled = true;
      try {
        const response = await fetch('/api/admin/users', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '删除失败');
        await loadUsers(); notice.textContent = `已删除用户：${username}`; notice.className = 'notice';
      } catch (error) {
        button.disabled = false; notice.textContent = error.message; notice.className = 'notice error';
      }
    });
    async function loadAnalytics() {
      const summaryRoot = document.getElementById('analytics-summary');
      const gamesRoot = document.getElementById('analytics-games');
      try {
        const response = await fetch('/api/admin/game-stats');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '加载游戏数据失败');
        const summary = data.summary || {};
        const fmt = value => Number(value || 0).toLocaleString('zh-CN');
        summaryRoot.innerHTML = [
          ['sessions', '总对局'],
          ['completed', '已结算'],
          ['players', '参与用户'],
          ['avg_duration_ms', '平均时长'],
        ].map(([key, label]) => `<div class="analytics-card"><b>${key === 'avg_duration_ms' ? `${Math.round(Number(summary[key] || 0) / 1000)}s` : fmt(summary[key])}</b><span>${label}</span></div>`).join('');
        gamesRoot.innerHTML = (data.games || []).map(game => `<div class="analytics-game"><div><strong>${escapeHtml(game.game_id)}</strong><small>${fmt(game.sessions)} 局 · ${fmt(game.completed)} 次结算 · 平均 ${fmt(game.avg_score)} 分</small></div><b>最高 ${fmt(game.best_score)}</b></div>`).join('') || '<p class="empty">还没有游戏数据</p>';
      } catch (error) {
        summaryRoot.innerHTML = `<p class="notice error">${escapeHtml(error.message)}</p>`;
        gamesRoot.replaceChildren();
      }
    }
    loadUsers();
    loadAnalytics();
  </script>
</body>
</html>
